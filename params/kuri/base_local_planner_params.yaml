SFWPlannerROS:

  max_trans_vel:        1.0
  min_trans_vel:        0.08
  max_rot_vel:          !degrees 60.0
  min_rot_vel:          !degrees 30.0
  max_trans_acc:        0.15
  max_rot_acc:          !degrees 30.0
  min_in_place_rot_vel: !degrees 40.0
  yaw_goal_tolerance:   0.2
  xy_goal_tolerance:    0.2
  wp_tolerance:         1.0
  sim_time:             1.0
  sim_granularity:      0.25
  
  #sensor interface params
  laser_topic:          scan
  people_topic:         people
  # dyn_obs_topic:        dynamic_obstacles
  odom_topic:           odom
  max_obstacle_dist:    3.0
  naive_goal_time:      1.0
  people_velocity:      1.9
  
  # sfm params
  sfm_goal_weight:      1.0
  sfm_obstacle_weight:  12.0
  sfm_people_weight:    8.0

  # cost function weights
  social_weight:        1.2
  costmap_weight:       2.0
  angle_weight:         0.7
  distance_weight:      1.0


SFMControllerROS:

  robot_frame: base_link
  planner_frame: odom

  max_lin_vel:        0.55
  min_lin_vel:        0.1
  max_rot_vel:        1.0
  min_rot_vel:        0.4
  min_rot_in_place:   0.5
  max_lin_acc:        0.1
  max_rot_acc:        3.2
  a:                  5.0
 
  goal_tolerance:     0.35
  yaw_tolerance:      3.14159
  local_goal_dist:    1.1
  robot_radius:       0.35
  people_radius:      0.35
  
  #sensor interface params
  laser_topic:        scan
  #people_topic:      
  dyn_obs_topic:      dynamic_obstacles
  odom_topic:         /robot_odom
  max_obstacle_dist:  3.0
  naive_goal_time:    1.0
  people_velocity:    1.9
  
  # sfm params
  sfm_goal_weight:    1.0
  sfm_obstacle_weight: 15.0
  sfm_people_weight:  8.0

  #collision checker
  use_laser:          true
  sensor_uncertainty: 0.05
  use_range:          false
