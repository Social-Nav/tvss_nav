name: sfm-arena
root: .

windows:
  - sfm:
      layout: tiled
      panes:
        - shell:
        - core:
          - roscore
        - arena:
          - roslaunch --wait tvss_nav start_arena_sfm.launch model:=rto
        - dynamic_reconf:
          - |
            # Wait for the arena launch to complete initialization
            while ! rostopic list | grep -q "/rto/move_base_flex/SFMControllerROS/parameter_descriptions"; do
              echo "Waiting for /rto/move_base_flex/SFMControllerROS/parameter_descriptions to become available before starting rqt_reconfigure..."
              sleep 1
            done

            # Start dynamic reconfigure
            rosrun rqt_reconfigure rqt_reconfigure
        - teleop:
          - roslaunch --wait teleop_twist_joy teleop.launch joy_config:=xbox joy_dev:=/dev/input/js0
        - cmd_relay:
          - rosrun topic_tools relay /cmd_vel /rto/cmd_vel