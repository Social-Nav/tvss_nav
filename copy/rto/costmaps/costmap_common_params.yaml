robot_base_frame: $(arg frame)base_link

#footprint: [[x0, y0], [x1, y1], ... [xn, yn]]
robot_radius: 0.225

inscribed_radius: 0.225
circumscribed_radius: 0.225

observation_sources: scan
scan:
  {
    sensor_frame: $(arg frame)hokuyo_link,
    data_type: LaserScan,
    topic: $(arg namespace)/scan,
    marking: true,
    clearing: true,
  }

obstacles_layer:
  enabled: false
  observation_sources: scan
  scan:
    {
      sensor_frame: $(arg frame)front_laser,
      data_type: LaserScan,
      topic: $(arg namespace)/scan,
      marking: true,
      clearing: true,
    }

inflation_radius: 1.0
cost_scaling_factor: 5.0

social_layer:
  enabled: true
  combination_method: 1
  observation_sources: social
  social:
    topic: /instance_array
    marking: true
    clearing: true
