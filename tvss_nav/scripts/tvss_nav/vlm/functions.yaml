functions:
  - name: segment_social_entities_from_name
    description: Segment objects in the image based on their names. Names can use hyphens to add descriptive terms (e.g., person-in-blue-shirt). Multiple objects can be specified using dots to separate them.
    parameters:
      type: object
      properties:
        object_names:
          type: string
          description: Names of objects to segment, separated by dots. Example person-in-black.car-on-left.dog-sitting
      required:
        - object_names
      additionalProperties: false
