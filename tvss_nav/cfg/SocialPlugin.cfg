#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, bool_t, double_t, int_t

gen = ParameterGenerator()

gen.add("enabled", bool_t, 0, "Whether to apply this plugin or not", True)

combo_enum = gen.enum([
    gen.const("Overwrite", int_t,  0, "Overwrite values"),
    gen.const("Maximum",   int_t,  1, "Take the maximum of the values"),
    gen.const("Nothing",   int_t, 99, "Do nothing")
], "Method for combining layers enum")

gen.add("combination_method", int_t, 0, "Method for combining two layers", 1, edit_method=combo_enum)

# Additional parameters used in SocialLayer

gen.add("min_height", double_t, 0, "Minimum height to consider", -0.1)
gen.add("max_height", double_t, 0, "Maximum height to consider", 2.0)
gen.add("default_cost_value", int_t, 0, "Default cost to use if instance cost is 0", 254, 0, 255)
gen.add("default_inflation_radius", double_t, 0, "Default inflation radius", 0.5)
gen.add("default_decay_rate", double_t, 0, "Default decay rate", 1.0)

exit(gen.generate("tvss_nav", "tvss_nav", "SocialPlugin"))
